<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
/* Page background and default text */
body {
  margin: 0;
  background-color: #0f172a;
  color: #e2e8f0;
  font-family: system-ui, -apple-system, sans-serif;
}

/* Notes list container */
.notes {
  max-width: 720px;
  margin: 2rem auto;
  padding: 0 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* Optional individual note card inside .notes */
.notes > div,
.notes .note {
  padding: 1rem 1.25rem;
  border: 1px solid #334155;
  border-radius: 8px;
  background-color: #1e293b;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
}

/* Tags container */
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: 0.75rem;
}

/* Optional individual tag pill/badge inside .tags */
.tags > span,
.tags > a,
.tags .tag {
  display: inline-block;
  padding: 0.25rem 0.7rem;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: #dbeafe;
  background-color: #1e3a8a;
  border: 1px solid #3b82f6;
  border-radius: 999px;
  text-decoration: none;
}

.tags > a:hover,
.tags .tag:hover {
  color: #ffffff;
  background-color: #2563eb;
  border-color: #60a5fa;
}
</style>

<body>
    <div class="notes">
        {{ notes }}
    </div>
</body>
</html>
